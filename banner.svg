<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a0e"/>
      <stop offset="60%" stop-color="#0d1f12"/>
      <stop offset="100%" stop-color="#060d0a"/>
    </linearGradient>
    <linearGradient id="glow-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00000000"/>
      <stop offset="20%" stop-color="#1db95488"/>
      <stop offset="50%" stop-color="#1db954ff"/>
      <stop offset="80%" stop-color="#1db95488"/>
      <stop offset="100%" stop-color="#00000000"/>
    </linearGradient>
    <linearGradient id="code-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="lingo-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="green-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="680" height="220" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#banner-clip)">
    <rect x="0" y="0" width="680" height="220" fill="url(#bg)"/>

    <!-- Grid lines -->
    <g opacity="0.06" stroke="#1db954" stroke-width="0.5">
      <line x1="0" y1="44" x2="680" y2="44"/>
      <line x1="0" y1="88" x2="680" y2="88"/>
      <line x1="0" y1="132" x2="680" y2="132"/>
      <line x1="0" y1="176" x2="680" y2="176"/>
      <line x1="136" y1="0" x2="136" y2="220"/>
      <line x1="272" y1="0" x2="272" y2="220"/>
      <line x1="408" y1="0" x2="408" y2="220"/>
      <line x1="544" y1="0" x2="544" y2="220"/>
    </g>

    <!-- Glowing orbs -->
    <ellipse cx="80" cy="60" rx="120" ry="80" fill="#1db954" opacity="0.06" filter="url(#soft-glow)"/>
    <ellipse cx="600" cy="170" rx="100" ry="70" fill="#1db954" opacity="0.05" filter="url(#soft-glow)"/>

    <!-- Decorative braces -->
    <text x="28" y="130" font-family="monospace" font-size="72" fill="#1db954" opacity="0.12" font-weight="700">{</text>
    <text x="622" y="130" font-family="monospace" font-size="72" fill="#1db954" opacity="0.12" font-weight="700">}</text>

    <!-- Top and bottom glow lines -->
    <rect x="0" y="2" width="680" height="1.5" fill="url(#glow-line)" opacity="0.7"/>
    <rect x="0" y="216" width="680" height="1.5" fill="url(#glow-line)" opacity="0.7"/>

    <!-- Corner decorations -->
    <rect x="30" y="28" width="2" height="14" rx="1" fill="#1db954" opacity="0.5"/>
    <rect x="36" y="28" width="8" height="2" rx="1" fill="#1db954" opacity="0.3"/>
    <rect x="36" y="38" width="6" height="2" rx="1" fill="#1db954" opacity="0.2"/>

    <!-- Particles -->
    <circle cx="120" cy="185" r="1.5" fill="#1db954" opacity="0.25"/>
    <circle cx="145" cy="175" r="1" fill="#1db954" opacity="0.18"/>
    <circle cx="560" cy="42" r="1.5" fill="#1db954" opacity="0.25"/>
    <circle cx="585" cy="55" r="1" fill="#1db954" opacity="0.18"/>
    <circle cx="540" cy="60" r="2" fill="#1db954" opacity="0.12"/>

    <!-- CODE in bold green -->
    <text
      x="184"
      y="135"
      font-family="'Courier New', 'Lucida Console', monospace"
      font-size="76"
      font-weight="900"
      fill="url(#code-grad)"
      filter="url(#green-glow)"
      letter-spacing="-2"
    >CODE</text>

    <!-- LINGO in white/light -->
    <text
      x="370"
      y="135"
      font-family="'Courier New', 'Lucida Console', monospace"
      font-size="76"
      font-weight="900"
      fill="url(#lingo-grad)"
      letter-spacing="-2"
    >LINGO</text>

    <!-- Green underline accent under CODE -->
    <rect x="184" y="142" width="175" height="3" rx="1.5" fill="#1db954" opacity="0.7"/>

    <!-- Tagline -->
    <text
      x="340"
      y="175"
      font-family="'Courier New', 'Lucida Console', monospace"
      font-size="13"
      fill="#4ade80"
      opacity="0.75"
      text-anchor="middle"
      letter-spacing="3"
    >// LEARN · CODE · CONQUER</text>

    <!-- Terminal prompt decoration -->
    <text x="42" y="196" font-family="monospace" font-size="11" fill="#1db954" opacity="0.4">$</text>
    <rect x="54" y="186" width="28" height="12" rx="2" fill="#1db954" opacity="0.12"/>

    <!-- XP decoration -->
    <text x="610" y="50" font-family="monospace" font-size="11" fill="#fbbf24" opacity="0.5">★ XP</text>
    <text x="608" y="66" font-family="monospace" font-size="10" fill="#1db954" opacity="0.35">LVL UP</text>

    <!-- Border frame -->
    <rect x="1" y="1" width="678" height="218" rx="15" fill="none" stroke="#1db954" stroke-width="0.8" opacity="0.2"/>
  </g>
</svg>
